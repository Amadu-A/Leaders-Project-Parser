# .github/workflows/checks.yml
# Offline-тесты, PostgreSQL-интеграция, миграции и проверки frontend в CI.
name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: leaders_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test-only-password@127.0.0.1:5432/leaders_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@127.0.0.1:5432/leaders_test
      TEST_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest --cov=app --cov-branch --cov-report=term-missing
      - run: node --test tests/test_ui.mjs
      - run: alembic upgrade head && alembic check
