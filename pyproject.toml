# pyproject.toml
# Зависимости сервиса, тестов и единые проверки качества Python.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leaders-project-parser"
version = "0.1.0"
description = "Resumable, rate-limited Leaders Project catalogue collector"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4",
  "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5",
  "sqlalchemy>=2.0.40,<3", "psycopg[binary]>=3.2.6,<4",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "xlsxwriter>=3.2,<4",
  "playwright>=1.51,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1.5,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "openpyxl>=3.1,<4", "psutil>=7,<9", "aiosqlite>=0.21,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/css/*.css", "web/static/css/blocks/*.css", "web/static/js/*.js", "web/static/js/*.mjs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL with an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
